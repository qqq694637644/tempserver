{% extends "base.html" %}

{% block title %}文件下载{% endblock %}

{% block content %}
<section class="panel">
    <header class="panel-header">
        <div>
            <p class="eyebrow">TEMPSERVER</p>
            <h1>文件下载</h1>
        </div>
        <span class="file-count">{{ files|length }} 个文件</span>
    </header>

    {% if files %}
    <div class="file-list" role="list">
        {% for file in files %}
        <a class="file-row" href="{{ url_for('download_file', filename=file.name) }}" role="listitem">
            <span class="file-icon" aria-hidden="true">↓</span>
            <span class="file-name">{{ file.name }}</span>
            <span class="file-size">{{ file.size }}</span>
        </a>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-state">
        <p>暂时没有可下载的文件</p>
    </div>
    {% endif %}
</section>

<a class="admin-corner-entry" href="{{ url_for('admin_login') }}" aria-label="管理员登录">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 0 1 6 0v3H9Zm3 4a2 2 0 0 1 1 3.73V19h-2v-1.27A2 2 0 0 1 12 14Z"/>
    </svg>
</a>
{% endblock %}
